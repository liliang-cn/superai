<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
         other than zero on a notched phone. Without it iOS letterboxes the page
         inside the safe area and the insets are all 0; with it the page owns the
         whole screen and has to keep its own content clear of the notch and the
         home indicator, which styles.css does.

         maximum-scale/user-scalable turn pinch-zoom off: this is an app shell,
         not a document, and a pinch on it drags the layout out of shape rather
         than magnifying anything worth magnifying. iOS ignores user-scalable
         on its own, so the rule that actually stops the page lurching when a
         field is focused is the 16px minimum on inputs in styles.css. -->
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <!-- The SVG first: it stays sharp at any size and is what current browsers
         take. The .ico is for the ones that ask for /favicon.ico regardless, and
         the PNG is what iOS puts on a home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="alternate icon" href="/favicon.ico" sizes="any"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <title>SuperLeo</title>
    <!-- The first frame, before any stylesheet has loaded. Without it the
         webview paints its own background, which follows the system: on a Mac
         in dark appearance that was a black window for the whole start. The
         colours are the 3D scene's haze, so the boot screen fades into it. -->
    <meta name="color-scheme" content="light dark"/>
    <script>
      // data-theme too, not only the boot screen's: styles.css takes the dark
      // palette when the attribute is missing, and React sets it only after
      // it has mounted, which left a dark second between this screen and the
      // app.
      (function () {
        var t = "light";
        try { if (localStorage.getItem("superleo-theme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.dataset.boot = t;
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html { background: #f3f5f8; color-scheme: light; }
      html[data-boot="dark"] { background: #0a1015; color-scheme: dark; }
      #boot { --ink: #16202b; --mute: #8a96a3; --line: #c9d2dc; --sig: #2f6bff; --sig-soft: rgba(47,107,255,.12); --bg: #f3f5f8; --dot: rgba(22,32,43,.10);
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; overflow: hidden; background: var(--bg);
        font-family: "Geist Variable", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        transition: opacity .6s ease .1s; -webkit-user-select: none; user-select: none; }
      html[data-boot="dark"] #boot { --ink: #e6edf3; --mute: #7d8a97; --line: #2a3642; --sig: #5b8cff; --sig-soft: rgba(91,140,255,.16); --bg: #0a1015; --dot: rgba(230,237,243,.08); }
      /* Every moving part moves by opacity and transform only, which the
         compositor runs: the app's own start keeps the main thread busy, and
         anything animated there stood still until it was nearly up. */
      #boot * { will-change: transform, opacity; }
      #boot .grid { position: absolute; inset: -40px; opacity: 0;
        background-image: radial-gradient(var(--dot) 1px, transparent 1.4px); background-size: 22px 22px;
        -webkit-mask-image: radial-gradient(circle at center, #000 0, transparent 46%); mask-image: radial-gradient(circle at center, #000 0, transparent 46%);
        animation: bt-grid 1.6s .1s ease-out forwards, bt-drift 18s linear infinite; }
      #boot .bt { position: relative; display: grid; justify-items: center; gap: 26px; transition: transform .7s cubic-bezier(.5,0,.2,1), opacity .5s ease; }
      #boot.gone { opacity: 0; pointer-events: none; }
      #boot.gone .bt { transform: scale(1.6); opacity: 0; }
      #boot .stage { position: relative; width: 220px; height: 220px; }
      #boot .stage > * { position: absolute; }
      #boot .glow { left: 30px; top: 30px; width: 160px; height: 160px; border-radius: 50%;
        background: radial-gradient(circle, var(--sig-soft) 0, transparent 68%); opacity: 0; transform: scale(.4); animation: bt-glow 1s .5s ease-out forwards, bt-breathe 2.6s 1.5s ease-in-out infinite; }
      #boot .orbit { inset: 0; opacity: 0; animation: bt-fade .8s .9s forwards, bt-turn 12s linear infinite; }
      #boot .orbit svg { width: 220px; height: 220px; overflow: visible; display: block; }
      #boot .orbit circle.r { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 6; }
      #boot .orbit circle.s { fill: var(--sig); }
      #boot .orbit2 { inset: 18px; opacity: 0; animation: bt-fade .8s 1.1s forwards, bt-turn-r 20s linear infinite; }
      #boot .orbit2 svg { width: 184px; height: 184px; overflow: visible; display: block; }
      #boot .orbit2 circle { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 28 10 2 10; opacity: .8; }
      #boot .cell { width: 48px; height: 48px; }
      #boot .cell svg { width: 100%; height: 100%; overflow: visible; display: block; }
      #boot .cell polygon { fill: var(--bg); stroke: var(--ink); stroke-width: 1.3; stroke-linejoin: round; }
      #boot .c0 polygon { fill: var(--sig); stroke: var(--sig); }
      #boot .c0 { left: 86.0px; top: 86.0px; animation: bt-c0 .9s 0.15s cubic-bezier(.16,1,.3,1) both; }
      #boot .c1 { left: 130.6px; top: 86.0px; animation: bt-c1 .9s 0.44s cubic-bezier(.16,1,.3,1) both; }
      #boot .c2 { left: 108.3px; top: 124.6px; animation: bt-c2 .9s 0.53s cubic-bezier(.16,1,.3,1) both; }
      #boot .c3 { left: 63.7px; top: 124.6px; animation: bt-c3 .9s 0.62s cubic-bezier(.16,1,.3,1) both; }
      #boot .c4 { left: 41.4px; top: 86.0px; animation: bt-c4 .9s 0.71s cubic-bezier(.16,1,.3,1) both; }
      #boot .c5 { left: 63.7px; top: 47.4px; animation: bt-c5 .9s 0.80s cubic-bezier(.16,1,.3,1) both; }
      #boot .c6 { left: 108.3px; top: 47.4px; animation: bt-c6 .9s 0.89s cubic-bezier(.16,1,.3,1) both; }
      #boot .spokes { inset: 0; opacity: 0; animation: bt-fade .6s 1.25s forwards; }
      #boot .spokes svg { width: 220px; height: 220px; display: block; }
      #boot .spokes line { stroke: var(--sig); stroke-width: 1; opacity: .35; }
      #boot .pulse { left: 107px; top: 107px; width: 6px; height: 6px; border-radius: 50%; background: var(--sig); box-shadow: 0 0 8px var(--sig); opacity: 0; }
      #boot .p0 { animation: bt-p0 1.4s 1.60s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .p1 { animation: bt-p1 1.4s 1.83s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .p2 { animation: bt-p2 1.4s 2.06s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .p3 { animation: bt-p3 1.4s 2.29s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .p4 { animation: bt-p4 1.4s 2.52s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .p5 { animation: bt-p5 1.4s 2.75s cubic-bezier(.5,0,.6,1) infinite; }
      #boot .wave { left: 86px; top: 86px; width: 48px; height: 48px; border-radius: 50%; border: 1.2px solid var(--sig); opacity: 0; }
      #boot .w1 { animation: bt-wave 2.4s 1.2s cubic-bezier(.2,.6,.3,1) infinite; }
      #boot .w2 { animation: bt-wave 2.4s 2s cubic-bezier(.2,.6,.3,1) infinite; }
      #boot .w3 { animation: bt-wave 2.4s 2.8s cubic-bezier(.2,.6,.3,1) infinite; }
      #boot .core { left: 105px; top: 105px; width: 10px; height: 10px; border-radius: 50%; background: #fff; opacity: 0; transform: scale(0); animation: bt-pop .5s .55s cubic-bezier(.3,1.8,.5,1) forwards, bt-beat 1.3s 1.4s ease-in-out infinite; }
      #boot .sweep { left: 30px; top: 30px; width: 160px; height: 160px; border-radius: 50%; overflow: hidden; opacity: 0; animation: bt-fade .3s 1.3s forwards; }
      #boot .sweep i { position: absolute; top: -20%; left: 0; width: 34%; height: 140%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent); transform: translateX(-120%) rotate(18deg); animation: bt-sweep 2.8s 1.4s ease-in-out infinite; }
      html[data-boot="dark"] #boot .sweep i { background: linear-gradient(90deg, transparent, rgba(91,140,255,.22), transparent); }
      #boot .word { display: flex; font-size: 24px; font-weight: 600; letter-spacing: .03em; color: var(--ink); }
      #boot .word span { display: inline-block; opacity: 0; transform: translateY(10px) scale(.9); animation: bt-up .55s cubic-bezier(.2,.9,.3,1.2) forwards; }
      #boot .word span.sig { color: var(--sig); }
      #boot .bar { width: 140px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; animation: bt-fade .4s 1.6s forwards; margin-top: -8px; }
      #boot .bar i { display: block; width: 36%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--sig)); transform: translateX(-110%); animation: bt-run 1.1s 1.6s cubic-bezier(.6,0,.4,1) infinite; }
      @keyframes bt-c0 { 0% { opacity: 0; transform: translate(0px,0px) rotate(0deg) scale(0.2); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c1 { 0% { opacity: 0; transform: translate(125px,16px) rotate(120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c2 { 0% { opacity: 0; transform: translate(89px,110px) rotate(-120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c3 { 0% { opacity: 0; transform: translate(-89px,110px) rotate(120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c4 { 0% { opacity: 0; transform: translate(-125px,16px) rotate(-120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c5 { 0% { opacity: 0; transform: translate(-89px,-138px) rotate(120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-c6 { 0% { opacity: 0; transform: translate(89px,-138px) rotate(-120deg) scale(0.3); } 70% { opacity: 1; } 100% { opacity: 1; transform: none; } }
      @keyframes bt-p0 { 0% { opacity: 0; transform: translate(44.6px,0.0px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-p1 { 0% { opacity: 0; transform: translate(22.3px,38.6px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-p2 { 0% { opacity: 0; transform: translate(-22.3px,38.6px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-p3 { 0% { opacity: 0; transform: translate(-44.6px,0.0px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-p4 { 0% { opacity: 0; transform: translate(-22.3px,-38.6px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-p5 { 0% { opacity: 0; transform: translate(22.3px,-38.6px) scale(.6); } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; transform: translate(0,0) scale(1.1); } }
      @keyframes bt-grid { to { opacity: 1; } }
      @keyframes bt-drift { from { transform: translate(0,0); } to { transform: translate(22px,22px); } }
      @keyframes bt-glow { to { opacity: 1; transform: scale(1); } }
      @keyframes bt-breathe { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.12); opacity: .7; } }
      @keyframes bt-fade { to { opacity: 1; } }
      @keyframes bt-turn { to { transform: rotate(360deg); } }
      @keyframes bt-turn-r { to { transform: rotate(-360deg); } }
      @keyframes bt-pop { to { opacity: 1; transform: scale(1); } }
      @keyframes bt-beat { 0%,100% { transform: scale(1); } 50% { transform: scale(.7); } }
      @keyframes bt-wave { 0% { opacity: .8; transform: scale(.9); } 100% { opacity: 0; transform: scale(3.6); } }
      @keyframes bt-sweep { 0% { transform: translateX(-120%) rotate(18deg); } 60%,100% { transform: translateX(380%) rotate(18deg); } }
      @keyframes bt-up { to { opacity: 1; transform: none; } }
      @keyframes bt-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="grid"></div>
  <div class="bt">
    <div class="stage">
      <div class="glow"></div>
      <div class="orbit"><svg viewBox="0 0 220 220"><circle class="r" cx="110" cy="110" r="104"/><circle class="s" cx="110" cy="6" r="3"/></svg></div>
      <div class="orbit2"><svg viewBox="0 0 184 184"><circle cx="92" cy="92" r="90"/></svg></div>
      <div class="spokes"><svg viewBox="0 0 220 220"><line x1="110" y1="110" x2="154.6" y2="110.0"/><line x1="110" y1="110" x2="132.3" y2="148.6"/><line x1="110" y1="110" x2="87.7" y2="148.6"/><line x1="110" y1="110" x2="65.4" y2="110.0"/><line x1="110" y1="110" x2="87.7" y2="71.4"/><line x1="110" y1="110" x2="132.3" y2="71.4"/></svg></div>
      <div class="cell c0"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c1"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c2"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c3"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c4"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c5"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="cell c6"><svg viewBox="0 0 48 48"><polygon points="24.0,1.0 43.9,12.5 43.9,35.5 24.0,47.0 4.1,35.5 4.1,12.5"/></svg></div>
      <div class="sweep"><i></i></div>
      <i class="pulse p0"></i>
      <i class="pulse p1"></i>
      <i class="pulse p2"></i>
      <i class="pulse p3"></i>
      <i class="pulse p4"></i>
      <i class="pulse p5"></i>
      <i class="wave w1"></i><i class="wave w2"></i><i class="wave w3"></i>
      <i class="core"></i>
    </div>
    <div class="word"><span style="animation-delay:1.00s">S</span><span style="animation-delay:1.06s">u</span><span style="animation-delay:1.12s">p</span><span style="animation-delay:1.18s">e</span><span style="animation-delay:1.24s">r</span><span class="sig" style="animation-delay:1.30s">L</span><span class="sig" style="animation-delay:1.36s">e</span><span class="sig" style="animation-delay:1.42s">o</span></div>
    <div class="bar"><i></i></div>
  </div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
