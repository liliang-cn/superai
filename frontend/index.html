<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) report anything
         other than zero on a notched phone. Without it iOS letterboxes the page
         inside the safe area and the insets are all 0; with it the page owns the
         whole screen and has to keep its own content clear of the notch and the
         home indicator, which styles.css does.

         maximum-scale/user-scalable turn pinch-zoom off: this is an app shell,
         not a document, and a pinch on it drags the layout out of shape rather
         than magnifying anything worth magnifying. iOS ignores user-scalable
         on its own, so the rule that actually stops the page lurching when a
         field is focused is the 16px minimum on inputs in styles.css. -->
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
    <!-- The SVG first: it stays sharp at any size and is what current browsers
         take. The .ico is for the ones that ask for /favicon.ico regardless, and
         the PNG is what iOS puts on a home screen. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"/>
    <link rel="alternate icon" href="/favicon.ico" sizes="any"/>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
    <title>SuperLeo</title>
    <!-- The first frame, before any stylesheet has loaded. Without it the
         webview paints its own background, which follows the system: on a Mac
         in dark appearance that was a black window for the whole start. The
         colours are the 3D scene's haze, so the boot screen fades into it. -->
    <meta name="color-scheme" content="light dark"/>
    <script>
      // data-theme too, not only the boot screen's: styles.css takes the dark
      // palette when the attribute is missing, and React sets it only after
      // it has mounted, which left a dark second between this screen and the
      // app.
      (function () {
        var t = "light";
        try { if (localStorage.getItem("superleo-theme") === "dark") t = "dark"; } catch (e) {}
        document.documentElement.dataset.boot = t;
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <style>
      html { background: #f3f5f8; color-scheme: light; }
      html[data-boot="dark"] { background: #0a1015; color-scheme: dark; }
      #boot { --ink: #16202b; --mute: #8a96a3; --line: #c9d2dc; --sig: #2f6bff; --bg: #f3f5f8;
        position: fixed; inset: 0; z-index: 2147483000; display: grid; place-items: center; background: var(--bg);
        font-family: "Geist Variable", -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        transition: opacity .5s ease, transform .6s cubic-bezier(.2,.7,.2,1); -webkit-user-select: none; user-select: none; }
      html[data-boot="dark"] #boot { --ink: #e6edf3; --mute: #7d8a97; --line: #2a3642; --sig: #5b8cff; --bg: #0a1015; }
      #boot.gone { opacity: 0; transform: scale(1.04); pointer-events: none; }
      #boot .bt { display: grid; justify-items: center; gap: 22px; }
      /* Every moving part is its own element and moves only by opacity and
         transform, which the compositor runs: the page's own start keeps the
         main thread busy, and a line drawn with stroke-dashoffset there sat
         still until the app was nearly up. */
      #boot .cell { position: relative; width: 168px; height: 168px; }
      #boot .cell > * { position: absolute; inset: 0; will-change: transform, opacity; }
      #boot svg { width: 100%; height: 100%; overflow: visible; display: block; }
      #boot .l-ring { opacity: 0; animation: bt-fade .8s .5s forwards, bt-turn 16s linear infinite; }
      #boot .l-ring circle { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 2 7; }
      #boot .l-hex { opacity: 0; transform: scale(.55) rotate(-30deg); animation: bt-in .9s cubic-bezier(.2,.8,.2,1) forwards; }
      #boot .l-hex polygon { fill: none; stroke: var(--ink); stroke-width: 1.4; stroke-linejoin: round; }
      #boot .l-inner { opacity: 0; transform: scale(1.5) rotate(30deg); animation: bt-in .9s .2s cubic-bezier(.2,.8,.2,1) forwards; }
      #boot .l-inner polygon { fill: none; stroke: var(--line); stroke-width: 1; }
      #boot .l-spokes { opacity: 0; transform: scale(.2); animation: bt-in .6s .75s ease-out forwards; }
      #boot .l-spokes line { stroke: var(--sig); stroke-width: 1; opacity: .5; }
      #boot .node { inset: auto; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; box-sizing: border-box;
        border: 1.4px solid var(--ink); background: var(--bg); opacity: 0; transform: scale(0); animation: bt-pop .45s cubic-bezier(.3,1.6,.5,1) forwards; }
      #boot .queen, #boot .pulse { inset: auto; left: 77px; top: 77px; width: 14px; height: 14px; border-radius: 50%; }
      #boot .queen { background: var(--sig); transform: scale(0); animation: bt-pop .5s .5s cubic-bezier(.3,1.7,.5,1) forwards; box-shadow: 0 0 0 4px color-mix(in srgb, var(--sig) 18%, transparent); }
      #boot .pulse { border: 1.2px solid var(--sig); opacity: 0; animation: bt-pulse 1.8s 1.1s ease-out infinite; }
      #boot .word { font-size: 22px; font-weight: 600; letter-spacing: .02em; color: var(--ink); opacity: 0; transform: translateY(6px); animation: bt-up .6s 1.05s ease-out forwards; }
      #boot .word b { color: var(--sig); font-weight: 600; }
      #boot .bar { width: 132px; height: 2px; border-radius: 2px; background: var(--line); overflow: hidden; opacity: 0; animation: bt-fade .4s 1.2s forwards; }
      #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: var(--sig); transform: translateX(-110%); animation: bt-run 1.2s 1.2s ease-in-out infinite; }
      @keyframes bt-in { to { opacity: 1; transform: none; } }
      @keyframes bt-pop { to { opacity: 1; transform: scale(1); } }
      @keyframes bt-fade { to { opacity: 1; } }
      @keyframes bt-up { to { opacity: 1; transform: none; } }
      @keyframes bt-turn { to { transform: rotate(360deg); } }
      @keyframes bt-pulse { 0% { opacity: .7; transform: scale(1); } 100% { opacity: 0; transform: scale(3.4); } }
      @keyframes bt-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #boot * { animation-duration: 1ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; }
      }
    </style>
</head>
<body>
<div id="boot" aria-hidden="true">
  <div class="bt">
    <div class="cell">
      <div class="l-ring"><svg viewBox="0 0 168 168"><circle cx="84" cy="84" r="80"/></svg></div>
      <div class="l-hex"><svg viewBox="0 0 168 168"><polygon points="84.0,20.0 139.4,52.0 139.4,116.0 84.0,148.0 28.6,116.0 28.6,52.0"/></svg></div>
      <div class="l-inner"><svg viewBox="0 0 168 168"><polygon points="84.0,46.0 116.9,65.0 116.9,103.0 84.0,122.0 51.1,103.0 51.1,65.0"/></svg></div>
      <div class="l-spokes"><svg viewBox="0 0 168 168"><line x1="84" y1="84" x2="84.0" y2="20.0"/><line x1="84" y1="84" x2="139.4" y2="52.0"/><line x1="84" y1="84" x2="139.4" y2="116.0"/><line x1="84" y1="84" x2="84.0" y2="148.0"/><line x1="84" y1="84" x2="28.6" y2="116.0"/><line x1="84" y1="84" x2="28.6" y2="52.0"/></svg></div>
      <i class="node" style="left:84.0px;top:20.0px;animation-delay:0.80s"></i>
      <i class="node" style="left:139.4px;top:52.0px;animation-delay:0.88s"></i>
      <i class="node" style="left:139.4px;top:116.0px;animation-delay:0.96s"></i>
      <i class="node" style="left:84.0px;top:148.0px;animation-delay:1.04s"></i>
      <i class="node" style="left:28.6px;top:116.0px;animation-delay:1.12s"></i>
      <i class="node" style="left:28.6px;top:52.0px;animation-delay:1.20s"></i>
      <i class="pulse"></i>
      <i class="queen"></i>
    </div>
    <div class="word">Super<b>Leo</b></div>
    <div class="bar"><i></i></div>
  </div>
</div>
<div id="root"></div>
<script src="./src/main.tsx" type="module"></script>
</body>
</html>
