# A hive of SuperAI workers sharing one CortexDB.
#
# One queen commands the others. What makes it queen is its settings:
# they list the workers as remote agents, and the hive_command tool appears only
# where such a list exists. The workers' settings list nothing, so they have no
# way to command upward or sideways.
#
# Every worker keeps its own volume (sessions, plans, its own login); what they
# share is the brain, through memory_backend "shared" on the "hive" namespace.
#
# The Secret is created by deploy/k3s/hive-secret.sh — settings carry model
# keys, so they never live in this file.
apiVersion: v1
kind: Namespace
metadata: {name: superai}
---
# What the agent may do to the cluster it lives in. The pod's ServiceAccount
# token is the only credential kubectl has, so this Role *is* the limit.
#
# Read the workload-level objects but not Secrets (a token in a prompt is a
# token in a model provider's logs), and change workloads: pods, deployments
# and their kin, services, configmaps, jobs. It cannot touch RBAC, nodes or
# namespaces. pods/exec is granted because operating a cluster needs it, and
# it is a way around the Secrets rule for any secret mounted into a pod.
# Widen it deliberately, not by default.
apiVersion: v1
kind: ServiceAccount
metadata: {name: superai, namespace: superai}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: superai-operator}
rules:
  # Listed one by one: "*" in the core group includes secrets.
  - apiGroups: [""]
    resources: [pods, services, endpoints, configmaps, namespaces, nodes, events,
                persistentvolumeclaims, persistentvolumes, serviceaccounts, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps, batch, networking.k8s.io, autoscaling, metrics.k8s.io, events.k8s.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/exec, pods/portforward]
    verbs: [create]
  - apiGroups: [apps, batch, networking.k8s.io, autoscaling]
    resources: ["*"]
    verbs: [create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: superai-operator}
subjects: [{kind: ServiceAccount, name: superai, namespace: superai}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: superai-operator}
---
apiVersion: v1
kind: Service
metadata: {name: superai-queen, namespace: superai}
spec:
  clusterIP: None
  selector: {app: superai-queen}
  ports: [{name: http, port: 43117}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: superai-queen, namespace: superai}
spec:
  serviceName: superai-queen
  replicas: 1
  selector: {matchLabels: {app: superai-queen}}
  template:
    metadata: {labels: {app: superai-queen}}
    spec:
      serviceAccountName: superai
      containers:
        - name: superai
          image: superai-desktop:hive
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 43117}]
          env:
            - {name: SUPERAI_TOKEN, valueFrom: {secretKeyRef: {name: superai-hive, key: token}}}
            - {name: SUPERAI_PASSWORD_HASH, valueFrom: {secretKeyRef: {name: superai-hive, key: password_hash, optional: true}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SUPERAI_ADVERTISE_URL, value: "http://$(POD_NAME).superai-queen.superai.svc.cluster.local:43117"}
            - {name: CORTEXDB_GRPC_TOKEN, valueFrom: {secretKeyRef: {name: superai-hive, key: cortexdb_token}}}
            - {name: SUPERAI_SETTINGS_JSON, valueFrom: {secretKeyRef: {name: superai-hive, key: settings-queen.json}}}
          readinessProbe:
            httpGet: {path: /api/session, port: 43117}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: superai-worker, namespace: superai}
spec:
  clusterIP: None
  selector: {app: superai-worker}
  ports: [{name: http, port: 43117}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: superai-worker, namespace: superai}
spec:
  serviceName: superai-worker
  # No replicas here on purpose. The queen resizes this set (hive_spawn,
  # hive_retire), and a field in this file would put every `kubectl apply` back
  # to the number written here. It starts at one worker.
  selector: {matchLabels: {app: superai-worker}}
  template:
    metadata: {labels: {app: superai-worker}}
    spec:
      serviceAccountName: superai
      containers:
        - name: superai
          image: superai-desktop:hive
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 43117}]
          env:
            - {name: SUPERAI_TOKEN, valueFrom: {secretKeyRef: {name: superai-hive, key: token}}}
            - {name: SUPERAI_PASSWORD_HASH, valueFrom: {secretKeyRef: {name: superai-hive, key: password_hash, optional: true}}}
            - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: SUPERAI_ADVERTISE_URL, value: "http://$(POD_NAME).superai-worker.superai.svc.cluster.local:43117"}
            - {name: CORTEXDB_GRPC_TOKEN, valueFrom: {secretKeyRef: {name: superai-hive, key: cortexdb_token}}}
            - {name: SUPERAI_SETTINGS_JSON, valueFrom: {secretKeyRef: {name: superai-hive, key: settings-worker.json}}}
          readinessProbe:
            httpGet: {path: /api/session, port: 43117}
          volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}
---
# The queen's UI. Traefik answers on port 80 of every node, and with no
# host rule any name reaching a node lands here — the LAN address is enough.
# Only the queen is exposed: the workers are reached by it, from inside.
# The login gate is the app's own (a password_hash in the Secret).
apiVersion: v1
kind: Service
metadata: {name: superai-queen-web, namespace: superai}
spec:
  selector: {app: superai-queen}
  ports: [{name: http, port: 80, targetPort: 43117}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: superai-queen, namespace: superai}
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: superai-queen-web, port: {number: 80}}}
