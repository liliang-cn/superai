<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#4F2BB8"/>
    </linearGradient>
    <linearGradient id="mane" x1="280" y1="240" x2="760" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFB23E"/>
      <stop offset="1" stop-color="#F0820E"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#FFF1D6"/>
      <stop offset="1" stop-color="#FFD89A"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1A1036" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- app icon background (squircle-ish) -->
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="#FFFFFF" opacity="0.04"/>

  <g filter="url(#soft)">
    <!-- mane: ring of rounded petals -->
    <g fill="url(#mane)">
      <g id="petals">
        <ellipse cx="512" cy="262" rx="78" ry="92"/>
      </g>
      <use href="#petals" transform="rotate(30 512 512)"/>
      <use href="#petals" transform="rotate(60 512 512)"/>
      <use href="#petals" transform="rotate(90 512 512)"/>
      <use href="#petals" transform="rotate(120 512 512)"/>
      <use href="#petals" transform="rotate(150 512 512)"/>
      <use href="#petals" transform="rotate(180 512 512)"/>
      <use href="#petals" transform="rotate(210 512 512)"/>
      <use href="#petals" transform="rotate(240 512 512)"/>
      <use href="#petals" transform="rotate(270 512 512)"/>
      <use href="#petals" transform="rotate(300 512 512)"/>
      <use href="#petals" transform="rotate(330 512 512)"/>
    </g>
    <!-- inner mane ring -->
    <circle cx="512" cy="512" r="232" fill="#FF9E2C"/>

    <!-- ears -->
    <circle cx="372" cy="392" r="62" fill="url(#mane)"/>
    <circle cx="652" cy="392" r="62" fill="url(#mane)"/>
    <circle cx="372" cy="392" r="34" fill="#FFD89A"/>
    <circle cx="652" cy="392" r="34" fill="#FFD89A"/>

    <!-- face -->
    <circle cx="512" cy="516" r="206" fill="url(#face)"/>

    <!-- cheeks -->
    <circle cx="406" cy="556" r="40" fill="#FF8A5C" opacity="0.35"/>
    <circle cx="618" cy="556" r="40" fill="#FF8A5C" opacity="0.35"/>

    <!-- eyes -->
    <circle cx="438" cy="484" r="30" fill="#2A1A4A"/>
    <circle cx="586" cy="484" r="30" fill="#2A1A4A"/>
    <circle cx="448" cy="474" r="10" fill="#FFFFFF"/>
    <circle cx="596" cy="474" r="10" fill="#FFFFFF"/>

    <!-- nose -->
    <path d="M512 540 q34 0 34 26 q0 24 -34 40 q-34 -16 -34 -40 q0 -26 34 -26Z" fill="#3A2358"/>

    <!-- mouth -->
    <path d="M512 606 v22 M512 628 q-40 28 -78 4 M512 628 q40 28 78 4"
          stroke="#3A2358" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- whiskers -->
    <g stroke="#7A5A2E" stroke-width="9" stroke-linecap="round" opacity="0.55">
      <path d="M392 596 h-78 M398 624 h-72"/>
      <path d="M632 596 h78 M626 624 h72"/>
    </g>
  </g>
</svg>
